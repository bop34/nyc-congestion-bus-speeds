[project]
name = "nyc-congestion-bus-speeds"
version = "0.1.0"
description = "Analysis of NYC congestion bus speeds using Python."
readme = "README.md"
authors = [
    { name = "Seamus Hughes", email = "68297036+bop34@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyfixest>=0.60.0",
    "requests>=2.34.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
nyc-congestion-bus-speeds = "nyc_congestion_bus_speeds:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
